version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: gametracker_postgres
    environment:
      - POSTGRES_DB=gametracker
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build: ./gametracker-backend
    container_name: gametracker_backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/gametracker
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=dev_password
    depends_on:
      - postgres-db

  frontend:
    build: ./gametracker-frontend
    container_name: gametracker-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: